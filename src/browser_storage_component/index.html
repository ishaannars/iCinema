<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>html,body{margin:0;padding:0;height:0;overflow:hidden;background:transparent}</style>
</head>
<body>
<script>
(function () {
  function send(type, data) {
    window.parent.postMessage(Object.assign({isStreamlitMessage: true, type: type}, data || {}), "*");
  }

  function setValue(value) {
    send("streamlit:setComponentValue", {value: value, dataType: "json"});
  }

  function handleRender(event) {
    if (!event.data || event.data.type !== "streamlit:render") return;
    const args = event.data.args || {};
    const action = args.action;
    const storageKey = args.storage_key;

    try {
      if (action === "get") {
        const raw = window.localStorage.getItem(storageKey);
        let value = null;
        if (raw !== null) {
          try { value = JSON.parse(raw); } catch (_) { value = null; }
        }
        setValue({loaded: true, value: value});
      } else if (action === "set") {
        window.localStorage.setItem(storageKey, JSON.stringify(args.value));
        setValue({saved: true});
      } else if (action === "delete") {
        window.localStorage.removeItem(storageKey);
        setValue({deleted: true});
      } else {
        setValue({error: "unknown_action"});
      }
    } catch (err) {
      setValue({error: String(err)});
    }
    send("streamlit:setFrameHeight", {height: 0});
  }

  window.addEventListener("message", handleRender);
  send("streamlit:componentReady", {apiVersion: 1});
  send("streamlit:setFrameHeight", {height: 0});
})();
</script>
</body>
</html>
